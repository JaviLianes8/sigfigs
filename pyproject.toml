[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigfigs"
version = "0.2.0"
description = "Significant-figures rounding and formatting with exact Decimal math and preserved trailing zeros"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["significant figures", "rounding", "decimal", "formatting", "sigfigs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/sigfigs"
Issues = "https://github.com/JaviLianes8/sigfigs/issues"
Changelog = "https://github.com/JaviLianes8/sigfigs/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[project.scripts]
sigfigs = "sigfigs._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sigfigs"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src"]
addopts = "-q --doctest-modules"
